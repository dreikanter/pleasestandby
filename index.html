<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Stand By</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    pointer-events: none;
  }
  .error {
    color: #aaa;
    font-family: monospace;
    font-size: 1.2rem;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
</style>
</head>
<body>
<div id="error" class="error" hidden></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var url = params.get('url') || 'https://giphy.com/gifs/glitch-break-re-edit-26BRPQLuQvZCMqs1y';

  // Extract Giphy GIF ID from various URL formats
  var id = null;
  var match;

  if ((match = url.match(/giphy\.com\/gifs\/(?:.*-)?([a-zA-Z0-9]+)$/))) {
    id = match[1];
  } else if ((match = url.match(/giphy\.com\/media\/([a-zA-Z0-9]+)\//))) {
    id = match[1];
  } else if ((match = url.match(/giphy\.com\/embed\/([a-zA-Z0-9]+)/))) {
    id = match[1];
  }

  if (!id) {
    var error = document.getElementById('error');
    error.hidden = false;
    error.textContent = 'Invalid URL. Use ?url=https://giphy.com/gifs/...';
    return;
  }

  var iframe = document.createElement('iframe');
  iframe.src = 'https://giphy.com/embed/' + id;
  iframe.setAttribute('frameBorder', '0');
  iframe.setAttribute('allowFullScreen', '');
  document.body.appendChild(iframe);
})();
</script>
</body>
</html>
