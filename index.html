<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Feeder automatically publishes updates from blogs, web comics, public Telegram channels, YouTube channels, subreddits, AI channels, and other feeds to FreeFeed. Registration is invite-only.">
<meta name="theme-color" content="#141716">
<title>Feeder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html {
    color-scheme: dark;
    background: #141716;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 1.25rem;
    padding: max(1.25rem, env(safe-area-inset-top))
      max(1.25rem, env(safe-area-inset-right))
      max(1.25rem, env(safe-area-inset-bottom))
      max(1.25rem, env(safe-area-inset-left));
    color: #f4f3ed;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.6;
    pointer-events: none;
  }

  .panel {
    position: relative;
    width: 100%;
    max-width: 29rem;
    padding: clamp(1.75rem, 4vw, 2rem) clamp(2rem, 5vw, 2.5rem);
    border: 1px solid #454a43;
    border-radius: 0.5rem;
    background: #191d1a;
  }

  .description {
    margin: 0 0 1.5rem;
    color: #c0c5bc;
    font-size: 1rem;
  }

  .sign-in {
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    margin-inline: auto;
    min-height: 3rem;
    padding: 0.75rem 1.5rem;
    border-radius: 0.375rem;
    background: #d9edb0;
    color: #1b2711;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.5rem;
    white-space: nowrap;
    text-decoration: none;
    box-shadow: 0 1px 3px #0000001a, 0 1px 2px -1px #0000001a;
  }

  .sign-in:hover {
    background: #e7f6ca;
  }

  .sign-in:focus-visible {
    outline: 2px solid #f4f3ed;
    outline-offset: 1px;
  }

  .invitation {
    margin: 1.5rem 0 0;
    color: #a9b0a5;
    font-size: 0.875rem;
    line-height: 1.25rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .background { display: none; }
  }
</style>
</head>
<body>
<img class="background" src="assets/animation.gif" alt="">
<main class="panel">
  <p class="description"><strong>Feeder</strong> automatically publishes updates from blogs, web comics, public Telegram channels, YouTube channels, subreddits, AI channels, and other feeds to FreeFeed.</p>
  <a class="sign-in" href="https://app.fffeeder.com/session/new">
    Sign in
  </a>
  <p class="invitation">Registration is invite-only.</p>
</main>
</body>
</html>
