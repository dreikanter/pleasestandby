<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Stand By</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  img {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  .error {
    color: #aaa;
    font-family: monospace;
    font-size: 1.2rem;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
</style>
</head>
<body>
<img id="gif" alt="">
<div id="error" class="error" hidden></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var url = params.get('url') || 'https://giphy.com/gifs/glitch-break-re-edit-26BRPQLuQvZCMqs1y';

  // Extract Giphy GIF ID from various URL formats:
  //   https://giphy.com/gifs/slug-ID
  //   https://giphy.com/gifs/ID
  //   https://media.giphy.com/media/ID/giphy.gif
  //   or treat as direct image URL
  var id = null;
  var match;

  if ((match = url.match(/giphy\.com\/gifs\/(?:.*-)?([a-zA-Z0-9]+)$/))) {
    id = match[1];
  } else if ((match = url.match(/giphy\.com\/media\/([a-zA-Z0-9]+)\//))) {
    id = match[1];
  }

  var img = document.getElementById('gif');
  var error = document.getElementById('error');

  if (id) {
    img.src = 'https://media.giphy.com/media/' + id + '/giphy.gif';
  } else if (url.match(/^https?:\/\/.+/)) {
    // Assume it's a direct image URL
    img.src = url;
  } else {
    img.hidden = true;
    error.hidden = false;
    error.textContent = 'Invalid URL. Use ?url=https://giphy.com/gifs/...';
    return;
  }

  img.onerror = function () {
    img.hidden = true;
    error.hidden = false;
    error.textContent = 'Failed to load GIF. Check the URL and try again.';
  };
})();
</script>
</body>
</html>
